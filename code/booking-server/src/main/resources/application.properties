# Default profile: local database, no network dependency.
# Machine-specific overrides can be placed in the ignored application-local.properties.
spring.config.import=optional:file:./application-local.properties
server.port=8080
server.address=0.0.0.0
spring.jackson.default-property-inclusion=non_null
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.url=${BOOKING_DB_URL:jdbc:h2:file:./data/booking;DB_CLOSE_DELAY=-1}
spring.datasource.username=${BOOKING_DB_USERNAME:sa}
spring.datasource.password=${BOOKING_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
user.timezone=Asia/Ho_Chi_Minh
